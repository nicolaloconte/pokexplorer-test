name: Pokexplorer CI
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax check
        run: |
          for source in js/*.js; do node --check "$source"; done
      - name: Unit tests
        run: npm test
      - name: Asset integrity
        run: npm run assets
